<div class="scanlines"></div>
@if (player()) {
  <app-shell />
} @else {
  @switch (authView()) {
    @case ('login') { <app-login (back)="showStart()" /> }
    @case ('register') { <app-new-game (back)="showStart()" /> }
    @default { <app-start (chooseLogin)="showLogin()" (chooseRegister)="showRegister()" /> }
  }
}
