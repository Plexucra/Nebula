<div class="stage">
  <div class="wordmark">
    <span class="eyebrow">Persistentes Strategie-Universum</span>
    <h1>NEBULA</h1>
    <p class="tagline">Ungleich verteilte Ressourcen. Regionale Spezialisierung. Handel, Diplomatie und Krieg
      um die Kontrolle der Gateways.</p>
  </div>

  <div class="panel corner-frame card">
    <div class="eyebrow">Kommandozentrale</div>
    <h2>Willkommen</h2>
    <p class="hint">Alle Kommandanten teilen sich dieselbe Galaxie – jeder mit eigenem Heimatsystem.</p>

    <div class="start-actions">
      <button type="button" class="primary" (click)="chooseLogin.emit()">Login</button>
      <button type="button" class="ghost" (click)="chooseRegister.emit()">Registrieren</button>
    </div>
  </div>
</div>
