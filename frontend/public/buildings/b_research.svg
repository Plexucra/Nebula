<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" role="img" aria-label="Forschungszentrum">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0a1620"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad1ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="160" height="110" fill="url(#bg)"/>
  <!-- Lichtkegel der Kuppel -->
  <path d="M62 24 L98 24 L124 92 L36 92 Z" fill="url(#beam)"/>
  <!-- Kuppel und Sockel -->
  <g stroke="#5ad1ff" stroke-width="1.2" fill="#08141c" filter="url(#glow)">
    <path d="M40 92 L46 70 H114 L120 92 Z"/>
    <path d="M52 70 A28 26 0 0 1 108 70 Z"/>
    <circle cx="80" cy="44" r="6"/>
  </g>
  <!-- Bahnen um den Kern: das Symbol der Forschung -->
  <g fill="none" stroke="#5ad1ff" stroke-width="0.8" stroke-opacity="0.8">
    <ellipse cx="80" cy="44" rx="18" ry="7" transform="rotate(-25 80 44)"/>
    <ellipse cx="80" cy="44" rx="18" ry="7" transform="rotate(25 80 44)"/>
    <ellipse cx="80" cy="44" rx="18" ry="7" transform="rotate(90 80 44)"/>
  </g>
  <g fill="#5ad1ff">
    <circle cx="96" cy="37" r="1.6"/><circle cx="64" cy="51" r="1.6"/><circle cx="80" cy="26" r="1.6"/>
    <rect x="60" y="80" width="8" height="3" opacity="0.8"/><rect x="76" y="80" width="8" height="3" opacity="0.8"/><rect x="92" y="80" width="8" height="3" opacity="0.8"/>
  </g>
  <!-- Boden -->
  <path d="M0 92 H160" stroke="#5ad1ff" stroke-width="0.6" stroke-opacity="0.5"/>
</svg>
